name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Configuramos MySQL como servicio en el runner de GitHub
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: systemfood
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y Ejecutar Tests
        run: ./mvnw verify -B
        env:
          # Estas variables sobrescriben las de application.properties 
          # para que la app se conecte a la base de datos de test del workflow
          DB_URL: jdbc:mysql://127.0.0.1:3306/systemfood?useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: test

  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'FoodSystem'
          path: '.'
          format: 'HTML'
          
      - name: Subir reporte de seguridad
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: ${{github.workspace}}/reports
