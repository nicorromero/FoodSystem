# ============================================
#  PERFIL PRODUCCIÓN (Docker / Deployment)
# ============================================

# ============================================
#  DATASOURCE
# ============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:foodsystem_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
#  JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
#  JWT
# ============================================
jwt.secret=${JWT_SECRET}

# ============================================
#  SWAGGER (deshabilitado en producción)
# ============================================
springdoc.swagger-ui.enabled=false

# ============================================
#  ACTUATOR (solo health expuesto)
# ============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
