# --- Configuracion para Entorno de PRODUCCCION (prod) ---

# NUNCA usar 'update' ni 'create' en produccion.
# 'validate' comprueba que las tablas y columnas existan, pero no modifica el esquema.
# Las migraciones de base de datos en prod se deben hacer con scripts SQL (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=validate

# Por motivos de seguridad y rendimiento, no se imprimen las consultas SQL en produccion.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
