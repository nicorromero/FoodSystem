spring.application.name=tromer

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/systemfood?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate
# 'update' crea la tabla si no existe y actualiza columnas sin borrar datos.
# Cambiar a 'create' solo si quer\u00c3\u00a9s recrear todo desde cero.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- JWT Configuration ---
# Clave secreta generada en Base64 (mínimo 256 bits/32 bytes)
jwt.secret=${JWT_SECRET}
