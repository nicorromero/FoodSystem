spring.profiles.active=${SPRING_PROFILE:dev}
spring.application.name=tromer

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/systemfood?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate
# Las propiedades ddl-auto, show-sql y format_sql fueron movidas a application-dev.properties y application-prod.properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- JWT Configuration ---
# Clave secreta generada en Base64 (mínimo 256 bits/32 bytes)
jwt.secret=${JWT_SECRET}
