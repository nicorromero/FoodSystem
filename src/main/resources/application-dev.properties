# PERFIL DEV (Localhost / Docker local)

spring.datasource.url=jdbc:mysql://localhost:3306/foodsystem_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate en desarrollo puede validar o actualizar según tus pruebas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger habilitado en dev
springdoc.swagger-ui.enabled=true

