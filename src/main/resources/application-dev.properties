# --- Configuraci\u00c3\u00b3n para Entorno de DESARROLLO (dev) ---

# Actualiza el esquema de la BD autom\u00c3\u00a1ticamente sin borrar datos. Ideal para dev.
spring.jpa.hibernate.ddl-auto=create

# Muestra y formatea las consultas SQL en la consola para facilitar el debug.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
