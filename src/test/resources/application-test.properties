# ============================================
#  PERFIL DE TEST (Base de datos en memoria H2)
# ============================================

# Datasource H2 en memoria con compatibilidad MySQL
spring.datasource.url=jdbc:h2:mem:foodsystem_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret para entorno de pruebas
jwt.secret=dXNlci1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy1iYXNlNjQtZW5jb2Rpbmdz

# Desactivar Swagger en tests
springdoc.swagger-ui.enabled=false
